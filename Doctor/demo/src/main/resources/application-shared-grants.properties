# Explicit grants-only mode. Clinical public tables are still blocked pending their schema.
# Never combine with local profile or use it to bootstrap/reset the team database.
doctor.integration.shared-grants-enabled=true
doctor.blockchain.enabled=false
doctor.blockchain.deployment-reviewed=false
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
# Small demo pool: avoids opening the default ten sessions per application instance.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
