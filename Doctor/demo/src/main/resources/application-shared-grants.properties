# Shared grants and clinical reads. Public clinical writes/anchor are still gated.
# Never combine with local profile or use it to bootstrap/reset the team database.
doctor.integration.shared-grants-enabled=true
doctor.blockchain.enabled=${DOCTOR_BLOCKCHAIN_ENABLED:false}
doctor.blockchain.deployment-reviewed=${DOCTOR_DEPLOYMENT_REVIEWED:false}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
# Small demo pool: avoids opening the default ten sessions per application instance.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
# Bound HTTP concurrency instead of increasing connections to the team's Supabase pooler.
doctor.http.max-concurrent-requests=2
doctor.http.queue-wait-ms=10000
spring.jdbc.template.query-timeout=5s
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.transaction.default-timeout=10s
# Cache successful schema metadata only. No patient grants/accounts/content are cached.
# Stop/restart Doctor around coordinated schema migrations; 0 disables this optimisation.
doctor.integration.schema-cache-ms=60000
