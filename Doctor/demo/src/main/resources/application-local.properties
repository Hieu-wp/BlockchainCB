# Explicit opt-in isolated H2 only. No external DB credentials used.
spring.datasource.url=jdbc:h2:mem:doctor_local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/local-shared-schema.sql,classpath:db/local-doctor-schema.sql,classpath:db/local-blockchain-schema.sql
spring.sql.init.data-locations=classpath:db/local-specialties.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
doctor.storage.local-enabled=true
doctor.storage.local-root=./.private-doctor-files
# jwt.secret still requires JWT_SECRET, even in local development.
