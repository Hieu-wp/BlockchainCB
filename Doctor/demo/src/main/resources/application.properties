
spring.application.name=BlockchainCB
server.port=8080

# Supabase PostgreSQL MOI
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.zidwfarqhuhyjsrpyfvq
spring.datasource.password=blockchain@123

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# JWT
jwt.secret=${JWT_SECRET}

# Local private adapter is opt-in; configure production storage separately.
doctor.storage.local-enabled=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.sql.init.mode=never
logging.level.org.springframework.web=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Blockchain is opt-in after deployment/admin security review. Read-only RPC only.
doctor.blockchain.enabled=${DOCTOR_BLOCKCHAIN_ENABLED:false}
doctor.blockchain.deployment-reviewed=${DOCTOR_DEPLOYMENT_REVIEWED:false}
doctor.blockchain.rpc-url=${SEPOLIA_RPC_URL:}
doctor.blockchain.confirmations=${ANCHOR_CONFIRMATIONS:3}
doctor.wallet.domain=${DOCTOR_WALLET_DOMAIN:localhost:5173}
doctor.wallet.allowed-origins=${DOCTOR_WALLET_ALLOWED_ORIGINS:}

# Enable only after the shared Patient schema contract is reviewed. Never creates tables.
doctor.integration.shared-grants-enabled=${DOCTOR_SHARED_GRANTS_ENABLED:false}
