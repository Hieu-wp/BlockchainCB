spring.datasource.url=jdbc:h2:mem:doctor_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/local-shared-schema.sql,classpath:db/local-doctor-schema.sql
spring.sql.init.data-locations=classpath:db/local-specialties.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
doctor.storage.local-enabled=true
doctor.storage.local-root=./target/test-private-storage
debug=false
logging.level.root=WARN
