<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách hồ sơ khám sức khỏe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/records.css"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-medical sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <span class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></span>
            <span>MediCare Profile</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
                <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person-vcard me-1"></i>Hồ sơ BN</a></li>
                <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-clipboard2-pulse me-1"></i>Lịch sử khám</a></li>
                <li class="nav-item"><a class="nav-link" href="/access-grants.html" id="navAccessGrants"><i class="bi bi-shield-lock me-1"></i>Phân quyền BS</a></li>
                <li class="nav-item"><a class="nav-link" href="/access-logs.html"><i class="bi bi-clock-history me-1"></i>Nhật ký truy cập</a></li>
                <li class="nav-item ms-lg-3 ps-lg-3 border-lg-start d-flex align-items-center gap-2 mt-2 mt-lg-0 user-nav-box">
                    <span class="navbar-text fw-semibold text-white" id="navUserName"></span>
                    <button class="btn btn-sm btn-logout" id="btnLogout">
                        <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div id="pageError" class="alert alert-danger d-none rounded-3 shadow-sm"></div>

    <div class="profile-header p-4 mb-4">
        <div class="row align-items-center g-3">
            <div class="col-auto">
                <div class="avatar-circle"><i class="bi bi-person-fill"></i></div>
            </div>
            <div class="col">
                <h2 class="mb-1 fw-bold text-dark" id="pFullName">Đang tải...</h2>
                <p class="mb-2 text-muted small">
                    <i class="bi bi-card-text me-1 text-primary"></i>Mã BN: <strong class="text-dark" id="pCode">—</strong>
                    <span class="mx-2 text-secondary">|</span>
                    <i class="bi bi-calendar3 me-1 text-primary"></i><span id="pDob">—</span>
                    <span class="mx-2 text-secondary">|</span>
                    <i id="pGenderIcon" class="bi bi-gender-ambiguous me-1 text-primary"></i><span id="pGender">—</span>
                </p>
                <div class="d-flex flex-wrap gap-2">
                    <span class="badge badge-medical"><i class="bi bi-droplet-half me-1"></i>Nhóm máu: <span id="pBlood">—</span></span>
                    <span class="badge badge-medical"><i class="bi bi-telephone me-1"></i><span id="pPhone">—</span></span>
                    <span class="badge badge-medical"><i class="bi bi-geo-alt me-1"></i><span id="pAddress">—</span></span>
                    <span class="badge badge-follow" id="pFollow"></span>
                </div>
            </div>

            <div class="col-12 col-lg-auto text-lg-end">
                <div class="wallet-box p-3 rounded-3">
                    <div class="small fw-semibold text-muted mb-1">
                        <i class="bi bi-wallet2 me-1 text-primary"></i>Ví Blockchain (Sepolia)
                    </div>
                    <div id="walletStatusBadge" class="mb-2">
                        <span class="badge bg-secondary-subtle text-secondary">Chưa liên kết ví</span>
                    </div>
                    <button type="button" class="btn btn-sm btn-wallet fw-semibold w-100" id="btnConnectWallet" onclick="connectMetaMask()">
                        <i class="bi bi-link-45deg me-1"></i>Kết nối ví MetaMask
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card filter-card mb-4">
        <div class="card-body p-3 p-md-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3 col-sm-6">
                    <label class="form-label">Ngày khám</label>
                    <input type="date" class="form-control" id="filterDate">
                </div>
                <div class="col-md-3 col-sm-6">
                    <label class="form-label">Chuyên khoa</label>
                    <select class="form-select" id="filterSpecialty">
                        <option value="">Tất cả chuyên khoa</option>
                    </select>
                </div>
                <div class="col-md-4 col-sm-8">
                    <label class="form-label">Tìm kiếm hồ sơ</label>
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Nhập mã hồ sơ, tên bác sĩ..." id="filterSearch">
                        <button class="btn btn-medical px-3" type="button" id="btnSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-2 col-sm-4">
                    <button class="btn btn-outline-secondary w-100" id="btnReset">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card table-card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-medical table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th class="ps-4">Mã hồ sơ</th>
                        <th>Ngày khám</th>
                        <th>Chuyên khoa</th>
                        <th>Bác sĩ</th>
                        <th>Lý do khám</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-4">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody id="recordsBody"></tbody>
                </table>
            </div>
        </div>

        <div class="card-footer bg-white border-top d-flex flex-wrap justify-content-between align-items-center gap-3 px-4 py-3">
            <div class="text-muted small fw-medium" id="pageInfo"></div>
            <nav>
                <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
<script src="/js/blockchain-config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/records.js"></script>
</body>
</html>
