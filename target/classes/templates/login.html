<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MediCare Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f7fb; min-height: 100vh; display: flex; align-items: center; }
        .login-card { max-width: 420px; border: none; border-radius: 16px;
                      box-shadow: 0 4px 20px rgba(13,110,253,.12); }
        .brand { color: #0a4d8c; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card mx-auto p-4">
        <h3 class="brand text-center mb-4">
            <i class="bi bi-heart-pulse-fill me-2"></i>MediCare Profile
        </h3>

        <div id="loginError" class="alert alert-danger d-none py-2"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="email">Email</label>
                <input type="email" class="form-control" id="email" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" for="password">Mật khẩu</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="btnLogin">Đăng nhập</button>
        </form>
    </div>
</div>

<script src="js/common.js"></script>
<script>
    // Đã đăng nhập rồi thì vào thẳng trang hồ sơ
    if (Auth.token && Auth.role === "PATIENT") location.href = "records.html";

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("btnLogin");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("d-none");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        errorBox.textContent = "Vui lòng nhập email và mật khẩu";
        errorBox.classList.remove("d-none");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Đang đăng nhập...";
      try {
        const data = await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
          skipAuthRedirect: true,   // sai mật khẩu trả 401 nhưng không được chuyển trang
        });
        if (data.role !== "PATIENT") {
          throw new Error("Trang này chỉ dành cho tài khoản bệnh nhân");
        }
        Auth.save(data);
        location.href = "records.html";
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.textContent = "Đăng nhập";
      }
    });
</script>
</body>
</html>
