# Chỉ nằm trong test classpath. Không đọc application.properties chứa cấu hình dùng chung.
spring.application.name=blockchaincb-test
spring.datasource.url=jdbc:h2:mem:admin_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.sql.init.mode=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
