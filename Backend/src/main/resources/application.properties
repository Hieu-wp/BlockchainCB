
# ==========================================
# CẤU HÌNH ỨNG DỤNG BLOCKCHAINCB
# ==========================================

spring.application.name=blockchaincb
server.port=8080

# ==========================================
# KẾT NỐI SUPABASE POSTGRESQL
# ==========================================

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CẤU HÌNH SPRING DATA JPA
# ==========================================

# Chỉ kiểm tra cấu trúc database, không tự tạo hoặc sửa bảng
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# ==========================================
# CẤU HÌNH PHIÊN ĐĂNG NHẬP
# ==========================================

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
