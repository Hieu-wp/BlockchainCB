# Cấu hình ứng dụng
spring.application.name=blockchaincb
server.port=8080

# Lấy thông tin JDBC từ nút Connect của Supabase, không commit mật khẩu.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Đối chiếu bảng hiện có; tuyệt đối không tự tạo/sửa bảng của nhóm.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kiểm tra giá trị thực tế của doctors.approval_status trước khi thay đổi.
app.doctor.pending-status=${DOCTOR_PENDING_STATUS:PENDING}

# Phiên đăng nhập dựa trên cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
