
# ==========================================
# CẤU HÌNH ỨNG DỤNG BLOCKCHAINCB
# ==========================================

# Tên ứng dụng Spring Boot
spring.application.name=blockchaincb

# Cổng chạy Backend
server.port=8080

# ==========================================
# CẤU HÌNH TÀI KHOẢN ADMIN
# ==========================================

# Tên đăng nhập Admin lấy từ biến môi trường
admin.username=${ADMIN_USERNAME}

# Mật khẩu Admin lấy từ biến môi trường
admin.password=${ADMIN_PASSWORD}

# ==========================================
# CẤU HÌNH PHIÊN ĐĂNG NHẬP
# ==========================================

# Thời gian hết hạn phiên khi không hoạt động: 30 phút
server.servlet.session.timeout=30m

# Không cho JavaScript truy cập cookie phiên
server.servlet.session.cookie.http-only=true

# Giới hạn gửi cookie trong các yêu cầu khác trang
server.servlet.session.cookie.same-site=lax
