<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - MediCare Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --med-dark: #065f46;
            --med-primary: #059669;
            --med-accent: #10b981;
            --med-mint: #d1fae5;
            --med-bg: #f3faf7;
            --med-border: #d1e7dd;
            --med-text: #1e293b;
        }

        body {
            background: linear-gradient(135deg, #ecfdf5 0%, #f3faf7 50%, #d1fae5 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--med-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 1.5rem 0;
        }

        .login-card {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--med-border);
            border-top: 5px solid var(--med-primary);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(5, 150, 105, 0.14);
            padding: 2.75rem 2.5rem;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--med-accent), var(--med-dark));
            color: #ffffff;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.28);
        }

        .brand-title {
            color: var(--med-dark);
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: 0.2px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.98rem;
            color: var(--med-dark);
            margin-bottom: 0.45rem;
        }

        .form-control-lg {
            font-size: 1rem;
            padding: 0.78rem 1rem;
            border-radius: 12px;
            border: 1.5px solid #cbd5e1;
        }

        .form-control-lg:focus {
            border-color: var(--med-accent);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.18);
        }

        .input-group-lg .form-control {
            border-radius: 12px 0 0 12px;
            border-right: none;
        }

        .input-group-lg .btn-toggle-pass {
            border: 1.5px solid #cbd5e1;
            border-left: none;
            border-radius: 0 12px 12px 0;
            background: #ffffff;
            color: #64748b;
            padding: 0 1rem;
        }

        .input-group-lg .form-control:focus + .btn-toggle-pass {
            border-color: var(--med-accent);
        }

        .btn-medical-login {
            background: linear-gradient(135deg, var(--med-primary) 0%, var(--med-dark) 100%);
            border: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.08rem;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(5, 150, 105, 0.28);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-medical-login:hover {
            background: var(--med-dark);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(6, 95, 70, 0.35);
        }

        .register-link {
            color: var(--med-primary);
            font-weight: 700;
            text-decoration: none;
        }

        .register-link:hover {
            color: var(--med-dark);
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card login-card mx-auto">
        <div class="text-center mb-4">
            <div class="brand-logo">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>
            <h2 class="brand-title mb-1">MediCare Profile</h2>
            <p class="text-muted mb-0">Cổng thông tin hồ sơ sức khỏe bệnh nhân</p>
        </div>

        <div id="loginError" class="alert alert-danger d-none py-2 px-3 rounded-3"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email">
                    <i class="bi bi-envelope me-1"></i>Email đăng nhập
                </label>
                <input type="email" class="form-control form-control-lg" id="email" placeholder="nhapemail@example.com" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">
                    <i class="bi bi-lock me-1"></i>Mật khẩu
                </label>
                <div class="input-group input-group-lg">
                    <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu của bạn" required>
                    <button class="btn btn-toggle-pass" type="button" id="togglePassword" tabindex="-1" title="Hiện/ẩn mật khẩu">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-medical-login w-100 mb-4" id="btnLogin">
                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
            </button>

            <div class="text-center pt-3 border-top">
                <span class="text-muted">Bạn chưa có tài khoản?</span>
                <a href="/register.html" class="register-link ms-1">Đăng ký ngay</a>
            </div>
        </form>
    </div>
</div>

<script src="/js/common.js"></script>
<script>
    if (Auth.token && Auth.role === "PATIENT") location.href = "/records.html";

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("btnLogin");
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePassword");

    toggleBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleBtn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("d-none");

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
            errorBox.textContent = "Vui lòng nhập email và mật khẩu";
            errorBox.classList.remove("d-none");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
        try {
            const data = await apiFetch("/auth/login", {
                method: "POST",
                body: JSON.stringify({ email, password }),
                skipAuthRedirect: true,
            });
            if (data.role !== "PATIENT") {
                throw new Error("Trang này chỉ dành cho tài khoản bệnh nhân");
            }
            Auth.save(data);
            location.href = "/records.html";
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.classList.remove("d-none");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập';
        }
    });
</script>
</body>
</html>
